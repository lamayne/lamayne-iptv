[package]
name = "lamayne-iptv"
version = "0.1.0"
description = "LAMAYNE IPTV — a personal player for your IPTV sources (Xtream, M3U)"
license = "MIT"
authors = ["LAMAYNE IPTV contributors"]
edition = "2021"

[lib]
name = "lamayne_iptv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
chrono = "0.4"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
urlencoding = "2"
tauri-plugin-libmpv = "0.3.2"
keyring = { version = "3", features = ["windows-native"] }
roxmltree = "0.20"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-opener = "2"

# Diffusion vers les appareils Google (Chromecast, Google TV…).
rust_cast = "0.21"
mdns-sd = "0.17"
rustls = "0.23"

[features]
# Ancienne option, conservée pour que `--features cast` ne provoque pas d'erreur.
# La diffusion est désormais toujours incluse.
cast = []

# Installateur plus petit et programme un peu plus rapide.
# Ne pas ajouter `panic = "abort"` : la diffusion s'appuie sur la capture des erreurs internes.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
